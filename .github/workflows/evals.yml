name: Evals

permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/lib/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/evals.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/lib/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/evals.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.17'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run CI evals
        if: env.GROQ_API_KEY != ''
        run: bun run eval:ci

      - name: Skip evals without secrets
        if: env.GROQ_API_KEY == ''
        run: echo "skipped: no secrets (fork PR)"

      - name: Upload evals results
        if: always() && env.GROQ_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: eval-results/ci-latest.json
          retention-days: 30
